
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordMaster - Learn English</title>

  <style>
    /* 1. General page design */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f3ff;
      color: #24213a;
      margin: 0;
      padding: 40px 20px;
    }

    /* 2. Main content area */
    .container {
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
    }

    /* 3. Main heading */
    h1 {
      color: #6546d7;
      font-size: 38px;
    }

    /* 4. Vocabulary card */
    .word-card {
      background-color: white;
      padding: 30px;
      margin-top: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px #28204a12;
    }

    .label {
      color: #756d91;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .word {
      color: #6546d7;
      font-size: 32px;
      margin-bottom: 10px;
    }

    /* 5. Learning button */
    button {
      background-color: #6546d7;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #4d32b5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>WordMaster</h1>
    <p>Your journey to better English starts here.</p>

    <div class="word-card">
      <p class="label">Today's Word</p>
      <h2 class="word">Curious</h2>
      <p><strong>Definition:</strong> Wanting to learn or know something.</p>
      <p><strong>Example:</strong> I am curious about how computers work.</p>
      <button>Start Learning</button>
    </div>
  </div>
</body>
</html>
body {
  background-color: #f4f3ff;
}
